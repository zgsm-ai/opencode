name: build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.2.3)"
        required: true
        type: string
      platform:
        description: "Platform to build"
        required: true
        type: choice
        default: all
        options:
          - all
          - linux-x64
          - linux-x64-baseline
          - linux-arm64
          - linux-x64-musl
          - linux-arm64-musl
          - darwin-arm64
          - darwin-x64
          - darwin-x64-baseline
          - windows-x64
          - windows-x64-baseline

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - linux-x64
          - linux-x64-baseline
          - linux-arm64
          - linux-x64-musl
          - linux-arm64-musl
          - darwin-arm64
          - darwin-x64
          - darwin-x64-baseline
          - windows-x64
          - windows-x64-baseline
    steps:
      - name: Check if platform should build
        id: check
        run: |
          if [[ "${{ inputs.platform }}" == "all" || "${{ inputs.platform }}" == "${{ matrix.platform }}" ]]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH agent
        if: steps.check.outputs.skip == 'false'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MY_SSH_PRIVATE_KEY }}

      - name: Fetch tags
        if: steps.check.outputs.skip == 'false'
        run: git fetch --force --tags

      - name: Setup Bun and install dependencies
        if: steps.check.outputs.skip == 'false'
        uses: ./.github/actions/setup-bun
        with:
          cross-compile: "true"
          canary: false

      - name: Restore bundled skills cache
        if: steps.check.outputs.skip == 'false'
        id: skills-cache
        uses: actions/cache@v4
        with:
          path: packages/opencode/bundled-skills
          key: bundled-skills-${{ runner.os }}-v1
          restore-keys: |
            bundled-skills-${{ runner.os }}-

      - name: Generate builtin agents
        if: steps.check.outputs.skip == 'false'
        run: bun run --cwd packages/opencode build:builtin-agents

      - name: Generate builtin skills
        if: steps.check.outputs.skip == 'false'
        run: bun run --cwd packages/opencode build:builtin-skills

      - name: Install platform-specific dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          cd packages/opencode
          bun install --os="*" --cpu="*" @opentui/core@$(node -p "require('./package.json').dependencies['@opentui/core']")
          bun install --os="*" --cpu="*" @parcel/watcher@$(node -p "require('./package.json').dependencies['@parcel/watcher']")

      - name: Build platform
        if: steps.check.outputs.skip == 'false'
        env:
          COSTRICT_VERSION: ${{ inputs.version }}
        run: |
          cd packages/opencode
          bun run script/build.ts --target ${{ matrix.platform }} --skip-install

      - name: Upload artifact
        if: steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: cs-${{ matrix.platform }}
          path: packages/opencode/dist/@costrict/cs-${{ matrix.platform }}/bin/
          retention-days: 7
          if-no-files-found: error

      - name: Build Summary
        if: steps.check.outputs.skip == 'false' && always()
        run: |
          echo "## CoStrict CLI Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "Platform: \`${{ matrix.platform }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Version: \`${{ inputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Visit the [Actions run page](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) to download the compiled binaries." >> $GITHUB_STEP_SUMMARY
